[package]
name = "esripbf"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
repository = "https://github.com/josiahparry/serde_esri"
authors = ["Josiah Parry<josiah.parry@gmail.com>"]
categories = ["encoding", "parser-implementations", "science::geo"]
keywords = ["arcgis", "esri", "protobuf", "pbf", "gis"]
description = "Protocol buffer types for Esri's FeatureCollection PBF format."
readme = "README.md"
include = ["src/**/*", "README.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost = "0.12.1"
bytes = "1.5.0"
serde_esri = { version = "2.0.0", path = "../serde_esri", optional = true }
serde_json = { version = "1.0.108", optional = true }

[features]
serde_esri = ["dep:serde_esri", "dep:serde_json"]

[dev-dependencies]
serde_json = "1.0.108"
