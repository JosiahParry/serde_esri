[package]
name = "esripbf"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
repository = "https://github.com/josiahparry/serde_esri"
authors = ["Josiah Parry<josiah.parry@gmail.com>"]
categories = ["encoding", "parser-implementations", "science::geo"]
keywords = ["arcgis", "esri", "protobuf", "pbf", "gis"]
description = "Protocol buffer types for Esri's FeatureCollection PBF format."
readme = "README.md"
include = ["src/**/*", "README.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
prost = "0.12.1"
bytes = "1.5.0"
serde_esri = { version = "2.0.0", path = "../serde_esri", optional = true }
serde_json = { version = "1.0.108", optional = true }
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
geoarrow-array = { version = "0.9.0", optional = true }
geoarrow-schema = { version = "0.9.0", optional = true }

[features]
serde_esri = ["dep:serde_esri", "dep:serde_json"]
geoarrow = [
    "serde_esri",
    "serde_esri/geoarrow",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:geoarrow-array",
    "dep:geoarrow-schema",
]

[dev-dependencies]
serde_json = "1.0.108"

[[example]]
name = "bench_pbf_arrow"
required-features = ["geoarrow"]
